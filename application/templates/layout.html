```html
<!-- Layout for all pages -->

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    {% block head %}
        <!-- Meta -->
        <meta charset="utf-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        >

        <meta
            name="description"
            content="Fang-Yu Ho 個人網站，展示地震預警、人工智慧、訊號處理、作品集與 AI 應用工具。"
        >

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
            crossorigin="anonymous"
        >

        <!-- Bootstrap JavaScript -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
            crossorigin="anonymous"
            defer>
        </script>

        <!-- Favicon -->
        <link
            href="{{ url_for('static', filename='images/favicon.ico') }}"
            rel="icon"
        >

        <!-- Boxicons -->
        <link
            href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
            rel="stylesheet"
        >

        <!-- Google Fonts -->
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        >

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >

        <link
            href="https://fonts.googleapis.com/css2?family=Lora&display=swap"
            rel="stylesheet"
        >

        <!-- Main CSS -->
        <link
            href="{{ url_for('static', filename='css/styles.css') }}"
            rel="stylesheet"
        >
    {% endblock %}

    <!-- Page Title -->
    <title>
        {% block title %}{% endblock %} | Fang-Yu Ho
    </title>
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-md fixed-top py-4">
        <div class="container">

            <!-- Logo -->
            <a
                class="navbar-brand"
                href="{{ url_for('home') }}"
                aria-label="返回首頁"
            >
                <img
                    class="img-fluid logo"
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Fang-Yu Ho Logo"
                >
            </a>
            <!-- End of Logo -->

            <!-- Mobile Navigation Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar"
                aria-controls="navbar"
                aria-expanded="false"
                aria-label="開啟導覽選單"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Menu -->
            <div
                class="collapse navbar-collapse"
                id="navbar"
            >
                <ul class="navbar-nav ms-auto">

                    <!-- Home -->
                    <li class="nav-item">
                        <a
                            class="nav-link me-3
                            {{ request.path | is_active(url_for('home')) }}"
                            href="{{ url_for('home') }}"
                        >
                            Home
                        </a>
                    </li>

                    <!-- About -->
                    <li class="nav-item">
                        <a
                            class="nav-link me-3
                            {{ request.path | is_active(url_for('about')) }}"
                            href="{{ url_for('about') }}"
                        >
                            About
                        </a>
                    </li>

                    <!-- Skills -->
                    <li class="nav-item">
                        <a
                            class="nav-link me-3
                            {{ request.path | is_active(url_for('skills')) }}"
                            href="{{ url_for('skills') }}"
                        >
                            Skills
                        </a>
                    </li>

                    <!-- Portfolio -->
                    <li class="nav-item">
                        <a
                            class="nav-link me-3
                            {{ request.path | is_active(url_for('portfolio')) }}"
                            href="{{ url_for('portfolio') }}"
                        >
                            Portfolio
                        </a>
                    </li>

                    <!-- AI Tools Dropdown -->
                    <li class="nav-item dropdown">
                        <a
                            class="nav-link dropdown-toggle me-3
                            {% if request.path == url_for('ai_assistant') %}
                                active
                            {% endif %}"
                            href="#"
                            id="aiToolsDropdown"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                        >
                            AI Tools
                        </a>

                        <ul
                            class="dropdown-menu"
                            aria-labelledby="aiToolsDropdown"
                        >
                            <!-- AI Assistant -->
                            <li>
                                <a
                                    class="dropdown-item
                                    {% if request.path == url_for('ai_assistant') %}
                                        active
                                    {% endif %}"
                                    href="{{ url_for('ai_assistant') }}"
                                >
                                    <i class="bx bx-message-square-dots me-2"></i>
                                    AI Assistant
                                </a>
                            </li>

                            <!-- Image Generator -->
                            <li>
                                <a
                                    class="dropdown-item disabled"
                                    href="#"
                                    aria-disabled="true"
                                    tabindex="-1"
                                >
                                    <i class="bx bx-image-add me-2"></i>
                                    Image Generator
                                </a>
                            </li>
                        </ul>
                    </li>
                    <!-- End of AI Tools Dropdown -->

                    <!-- Contact -->
                    <li class="nav-item">
                        <a
                            class="nav-link me-3
                            {{ request.path | is_active(url_for('contact')) }}"
                            href="{{ url_for('contact') }}"
                        >
                            Contact
                        </a>
                    </li>

                </ul>
            </div>
            <!-- End of Navigation Menu -->

        </div>
    </nav>
    <!-- End of Header -->

    <!-- Main Content -->
    <main>
        {% block main %}{% endblock %}
    </main>
    <!-- End of Main Content -->

    <!-- Footer -->
    <footer class="footer fixed-bottom py-3">
        <div class="container text-center">
            <div class="row">
                <div class="col-sm-12">

                    <!-- GitHub -->
                    <a
                        href="https://github.com/carol651104"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Fang-Yu Ho GitHub"
                    >
                        <i class="social-icon bx bxl-github px-1"></i>
                    </a>

                    <!-- Email -->
                    <a
                        href="mailto:carol651104@gmail.com"
                        aria-label="寄送電子郵件給 Fang-Yu Ho"
                    >
                        <i class="social-icon bx bxl-gmail px-1"></i>
                    </a>

                </div>
            </div>
        </div>
    </footer>
    <!-- End of Footer -->

</body>

</html>
```
